<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仙台連坊店の駐車場｜柿川亭</title>
<meta name="description" content="油そば柿川亭 仙台連坊店の駐車場のご案内。お停めいただけるのは 7・8・9番 です。">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --shu: #b3342a; --sumi: #1a1a1a; --hai: #666; --kinari: #f7f3ea; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; color: var(--sumi); background: #fff; line-height: 1.8; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 28px 16px 40px; }
  .logo { text-align: center; margin-bottom: 18px; }
  .logo img { width: 120px; margin: 0 auto; display: block; }
  h1 { font-family: "Shippori Mincho", serif; font-size: 22px; text-align: center; letter-spacing: .08em; }
  .sub { text-align: center; color: var(--hai); font-size: 13px; margin-top: 4px; }
  .nums { margin: 22px 0 10px; background: var(--kinari); border-radius: 14px; padding: 18px 12px 16px; text-align: center; }
  .nums .label { font-size: 14px; font-weight: 700; }
  .nums .big { display: flex; justify-content: center; gap: 12px; margin: 10px 0 8px; }
  .nums .big span { width: 76px; height: 76px; border-radius: 12px; background: var(--shu); color: #fff; font-size: 44px; font-weight: 900; display: flex; align-items: center; justify-content: center; font-family: "Lato", "Zen Maru Gothic", sans-serif; }
  .nums .note { font-size: 13px; color: var(--shu); font-weight: 700; }
  .photo { margin: 16px 0 0; }
  .photo img { width: 100%; display: block; border-radius: 14px; }
  .photo figcaption { font-size: 13px; color: var(--hai); margin-top: 6px; text-align: center; }
  .map { margin: 16px 0; border-radius: 14px; overflow: hidden; border: 1px solid #e6e1d6; aspect-ratio: 4 / 3; }
  .map iframe { width: 100%; height: 100%; border: 0; display: block; }
  .btn { display: block; text-align: center; text-decoration: none; border-radius: 999px; padding: 15px 10px; font-size: 17px; font-weight: 700; margin: 10px 0; }
  .btn.main { background: var(--shu); color: #fff; }
  .btn.sub { background: #fff; color: var(--sumi); border: 1.5px solid var(--sumi); font-size: 15px; }
  .info { margin-top: 22px; font-size: 14px; border-top: 1px solid #eee; padding-top: 14px; }
  .info dt { font-weight: 700; margin-top: 8px; }
  .info dd { color: #333; }
  .foot { margin-top: 26px; text-align: center; font-size: 12px; color: var(--hai); }
  .foot a { color: var(--hai); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="assets/logo_kakigawatei.png" alt="油そば 柿川亭"></div>
  <h1>仙台連坊店の駐車場</h1>
  <p class="sub">お店から歩いて約2分（南へ約140m）</p>

  <div class="nums">
    <div class="label">お停めいただけるのは</div>
    <div class="big"><span>7</span><span>8</span><span>9</span></div>
    <div class="note">この3台のみです。ほかの番号には停めないでください</div>
  </div>

  <figure class="photo">
    <img src="assets/parking_renbo_photo.jpg" alt="高架下の駐車場。壁ぎわのコーンに 9・8・7 の番号札" loading="lazy">
    <figcaption>高架下の駐車場です。壁ぎわのコーンの番号札（7・8・9）が目印です</figcaption>
  </figure>

  <div class="map">
    <iframe src="https://www.google.com/maps?q=38.2503128,140.8891664&z=18&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="駐車場の地図"></iframe>
  </div>

  <a class="btn main" href="https://www.google.com/maps/dir/?api=1&destination=38.2503128,140.8891664&travelmode=driving">Google マップでナビを開始</a>
  <a class="btn sub" href="https://maps.apple.com/?daddr=38.2503128,140.8891664&dirflg=d">iPhone のマップでナビを開始</a>

  <dl class="info">
    <dt>お店</dt>
    <dd>油そば 柿川亭 仙台連坊店<br>宮城県仙台市若林区連坊小路81 熊谷ビル103</dd>
  </dl>

  <p class="foot"><a href="./">柿川亭のサイトへ</a></p>
</div>
</body>
</html>
